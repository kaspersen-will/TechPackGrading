# CI: on every push to a branch and every pull request, and called by cd.yml on main.
# Validates the system description, then per service: lint, tests with coverage
# against a throwaway SQL Server container (never Azure SQL), and the image build.
# Only when cd.yml calls it for main does the build also push the image to GHCR.
# A failed job fails the run.
name: CI

on:
  push:
    branches-ignore: [main]  # main runs CI through cd.yml, so it doesn't run twice
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: system.yaml and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install check-jsonschema==0.39.0 openapi-spec-validator==0.9.0
      - name: system.yaml matches system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: Each openapi.yaml is valid OpenAPI 3
        run: openapi-spec-validator services/specs/openapi.yaml services/samples/openapi.yaml

  test:
    name: Lint and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [specs, samples]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .

      # Fresh random passwords on every run, masked in the log: nothing to leak, nothing
      # written in this file. The same compose services and db/init.sql as locally.
      - name: Start SQL Server and create the test databases and logins
        working-directory: .
        run: |
          for name in MSSQL_SA_PASSWORD SPECS_DB_PASSWORD SAMPLES_DB_PASSWORD; do
            value="Ci-$(openssl rand -hex 16)-Aa1"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done
          docker compose run --rm db-init

      - name: Tests, failing under 70% coverage
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          password_var="$(echo "$SERVICE" | tr a-z A-Z)_DB_PASSWORD"
          export TEST_DATABASE_URL="mssql://${SERVICE}_user:${!password_var}@localhost:1433/${SERVICE}_test"
          python -m pytest --cov --cov-report=term --cov-fail-under=70

      - name: SQL Server log, if something failed
        if: failure()
        working-directory: .
        run: docker compose logs mssql db-init

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # only used on main, to push to GHCR
    strategy:
      fail-fast: false
      matrix:
        service: [specs, samples]
    env:
      # Only a push to main (that is, cd.yml after a merge) publishes an image.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged with the commit SHA only, never just latest, so a deploy names exactly
      # what it runs. provenance: false: with an attestation, the tag points at an
      # image index that Container Apps can't pull.
      - name: docker build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/maison-grader-${{ matrix.service }}:${{ github.sha }}
          push: ${{ env.PUBLISH == 'true' }}
          provenance: false
