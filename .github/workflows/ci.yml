# CI: on every push and pull request, and called by the deploy workflow on main.
# Validates the system description, then per service: lint, tests with coverage
# against a throwaway SQL Server container (never Azure SQL), and the image build.
# A failed job fails the run.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: system.yaml and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install check-jsonschema==0.39.0 openapi-spec-validator==0.9.0
      - name: system.yaml matches system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: Each openapi.yaml is valid OpenAPI 3
        run: openapi-spec-validator services/specs/openapi.yaml services/samples/openapi.yaml

  test:
    name: Lint and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [specs, samples]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .

      # Fresh random passwords on every run, masked in the log: nothing to leak, nothing
      # written in this file. The same compose services and db/init.sql as locally.
      - name: Start SQL Server and create the test databases and logins
        working-directory: .
        run: |
          for name in MSSQL_SA_PASSWORD SPECS_DB_PASSWORD SAMPLES_DB_PASSWORD; do
            value="Ci-$(openssl rand -hex 16)-Aa1"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done
          docker compose run --rm db-init

      - name: Tests, failing under 70% coverage
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          password_var="$(echo "$SERVICE" | tr a-z A-Z)_DB_PASSWORD"
          export TEST_DATABASE_URL="mssql://${SERVICE}_user:${!password_var}@localhost:1433/${SERVICE}_test"
          python -m pytest --cov --cov-report=term --cov-fail-under=70

      - name: SQL Server log, if something failed
        if: failure()
        working-directory: .
        run: docker compose logs mssql db-init

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [specs, samples]
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: >-
          docker build
          --build-arg GIT_SHA=${{ github.sha }}
          --tag ${{ matrix.service }}:${{ github.sha }}
          services/${{ matrix.service }}
